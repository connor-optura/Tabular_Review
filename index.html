<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Optura AIEOS | Document Review</title>
    <link rel="icon" type="image/svg+xml" href="/public/optura-icon.svg">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              optura: {
                gold: '#b29c79',
                'gold-light': '#d4c9b5',
                'gold-dark': '#8a7759',
                dark: '#25262a',
                'dark-light': '#3a3b40',
              }
            }
          }
        }
      }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Merriweather:ital,wght@0,300;0,400;0,700;1,300;1,400&display=swap" rel="stylesheet">
    
    <style>
      body {
        font-family: 'Inter', sans-serif;
      }
      .font-serif {
        font-family: 'Merriweather', serif;
      }
      /* Custom Scrollbar - Thinner and more subtle */
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: transparent; 
      }
      ::-webkit-scrollbar-thumb {
        background: #b29c79;
        border-radius: 3px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #8a7759;
      }
      /* Highlighting */
      mark {
        background-color: #fef08a; /* yellow-200 */
        color: transparent;
        mix-blend-mode: multiply;
      }
    </style>
  <script type="importmap">
{

  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
